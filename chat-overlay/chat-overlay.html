<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chat Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chat-overlay.css">
</head>

<body>

    <!-- All three layouts stay in the DOM at once. chat-overlay.js toggles
         which one has .is-active (see chat-overlay.css), based on either the
         current OBS scene, through obs-websocket, or the configured default. -->
    <div id="layout-stack" class="layout">
        <div id="chat-feed"></div>
    </div>

    <div id="layout-popup" class="layout">
        <div id="popup-layer"></div>
    </div>

    <div id="layout-latest" class="layout">
        <div id="latest-message"></div>
    </div>

    <!-- chat-overlay.js shows this only while the obs-websocket connection is
         down (see shared/obs-websocket-client.js). It lets you notice a bad
         URL or password without opening the browser source's dev console. -->
    <div id="obs-status">
        <span class="obs-status-icon">⚠</span>
        <span class="obs-status-text">OBS disconnected</span>
    </div>

    <script src="../shared/twitch-chat.js"></script>
    <script src="../shared/twitch-token-manager.js"></script>
    <script src="../shared/twitch-eventsub.js"></script>
    <script src="../shared/obs-websocket-client.js"></script>
    <script src="../shared/secrets.local.js"></script>
    <script src="chat-overlay.js"></script>
    <script src="chat-overlay.config.js"></script>

</body>

</html>
