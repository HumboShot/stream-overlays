<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chat Overlay</title>
    <link rel="stylesheet" href="../shared/share-tech-mono.css">
    <link rel="stylesheet" href="chat-overlay.css">
</head>

<body>

    <!-- All three layouts stay in the DOM at once. chat-overlay.js toggles
         which one has .is-active (see chat-overlay.css), based on either the
         current OBS scene, through obs-websocket, or the configured default. -->
    <div id="layout-stack" class="layout">
        <div id="chat-feed"></div>
    </div>

    <div id="layout-popup" class="layout">
        <div id="popup-layer"></div>
    </div>

    <div id="layout-latest" class="layout">
        <div id="latest-message"></div>
    </div>

    <!-- The poll panel sits outside the layouts, so it shows in every scene.
         chat-overlay.js fills it from the EventSub channel.poll.* events. -->
    <div id="poll-panel">
        <div class="poll-header">
            <svg class="poll-icon" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true">
                <rect x="0" y="9" width="10" height="1" />
                <rect x="1" y="5" width="2" height="4" />
                <rect x="4" y="1" width="2" height="8" />
                <rect x="7" y="3" width="2" height="6" />
            </svg>
            <span class="poll-title"></span>
        </div>
        <div class="poll-choices"></div>
        <div class="poll-footer">
            <span class="poll-status"></span>
            <span class="poll-total"></span>
        </div>
    </div>

    <!-- chat-overlay.js shows each badge only while its connection is down:
         obs-websocket, Twitch chat (IRC), and Twitch EventSub (redeems,
         watch streaks, polls). It lets you notice a bad URL, password, or token
         without opening the browser source's dev console. -->
    <div id="connection-status">
        <div class="connection-badge" data-connection="obs">
            <span class="connection-badge-icon">⚠</span>
            <span class="connection-badge-text">OBS disconnected</span>
        </div>
        <div class="connection-badge" data-connection="chat">
            <span class="connection-badge-icon">⚠</span>
            <span class="connection-badge-text">Chat disconnected</span>
        </div>
        <div class="connection-badge" data-connection="alerts">
            <span class="connection-badge-icon">⚠</span>
            <span class="connection-badge-text">Alerts disconnected</span>
        </div>
    </div>

    <script src="../shared/twitch-chat.js"></script>
    <script src="../shared/twitch-token-manager.js"></script>
    <script src="../shared/twitch-eventsub.js"></script>
    <script src="../shared/obs-websocket-client.js"></script>
    <script src="../shared/secrets.local.js"></script>
    <script src="chat-overlay.js"></script>
    <script src="chat-overlay.config.js"></script>

</body>

</html>
