<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tuna Now Playing</title>
    <link rel="stylesheet" href="nowplaying-site.css">
    <style>
        /* This aligns the cover and text inside the terminal box. */
        #inner-content {
            display: flex;
            align-items: center;
            gap: 25px;
            /* Space between the cover and the text. */
            z-index: 50;
            position: relative;
            width: 100%;
            /* Helps this element span across the terminal box. */
            padding-left: 20px;
            /* Pushes this element slightly off the left wall. */
        }

        #cover {
            width: 150px;
            /* This is larger, to match the original size. */
            height: 150px;
            object-fit: cover;
            /* No border CSS is needed here, because the custom CSS already adds the purple border to all images. */
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Small gap between the title and the artist. */
        }

        #title {
            font-size: 38px;
            /* This is larger, to match the NowPlaying.Site scale. */
            font-weight: bold;
            line-height: 1;
        }

        #artist {
            font-size: 28px;
            /* This is larger, to match the NowPlaying.Site scale. */
            line-height: 1;
        }
    </style>
</head>

<body>

    <div id="root">
        <div id="player" class="closed">
            <div id="inner-content">
                <img id="cover" src="" alt="Album Art" />
                <div class="info">
                    <div id="title">Waiting for Plex</div>
                    <div id="artist">Start a song</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const player = document.getElementById("player");
        const titleEl = document.getElementById("title");
        const artistEl = document.getElementById("artist");
        const coverEl = document.getElementById("cover");

        // Store the current song title, to track when to change the cover.
        let currentTitle = "";

        // This function asks Tuna for the current song. It waits one second
        // after each answer, so a slow answer cannot start a second request.
        function updateTuna() {
            fetch("http://localhost:1608/")
                .then(response => response.json())
                .then(data => {
                    if (!data || !data.title || data.status.toLowerCase() !== "playing") {
                        player.classList.add("closed");
                        return;
                    }

                    player.classList.remove("closed");

                    // Change the text only when it changes, to prevent a layout pass every second.
                    const artist = data.artists ? data.artists.join(", ") : "Unknown Artist";
                    if (titleEl.textContent !== data.title) titleEl.textContent = data.title;
                    if (artistEl.textContent !== artist) artistEl.textContent = artist;

                    // Check if the song has changed.
                    if (currentTitle !== data.title) {
                        currentTitle = data.title;

                        // Use the exact URL that Tuna provides, plus a cache-buster to force OBS to update it.
                        // Leave this blank if there is no album art.
                        coverEl.src = data.cover_url ? data.cover_url + "?_=" + Date.now() : "";
                    }
                })
                .catch(() => {
                    player.classList.add("closed");
                })
                .finally(() => {
                    setTimeout(updateTuna, 1000);
                });
        }

        updateTuna();
    </script>
</body>

</html>
