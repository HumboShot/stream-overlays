<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PlexAmp Tuna Overlay</title>
    <link rel="stylesheet" href="nowplaying-site.css">
    <style>
        /* This aligns the cover and text inside the terminal box. */
        #inner-content {
            display: flex;
            align-items: center;
            gap: 25px;
            /* Space between the cover and the text. */
            z-index: 50;
            position: relative;
            width: 100%;
            /* Helps this element span across the terminal box. */
            padding-left: 20px;
            /* Pushes this element slightly off the left wall. */
        }

        #cover {
            width: 150px;
            /* This is larger, to match the original size. */
            height: 150px;
            object-fit: cover;
            /* No border CSS is needed here, because the custom CSS already adds the purple border to all images. */
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Small gap between the title and the artist. */
        }

        #title {
            font-size: 38px;
            /* This is larger, to match the NowPlaying.Site scale. */
            font-weight: bold;
            line-height: 1;
        }

        #artist {
            font-size: 28px;
            /* This is larger, to match the NowPlaying.Site scale. */
            line-height: 1;
        }
    </style>
</head>

<body>

    <div id="root">
        <div id="player" class="closed">
            <div id="inner-content">
                <img id="cover" src="" alt="Album Art" />
                <div class="info">
                    <div id="title">Waiting for Plex</div>
                    <div id="artist">Start a song</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Store the current song title, to track when to change the cover.
        let currentTitle = "";

        // This function asks Tuna for the current song every second.
        function updateTuna() {
            fetch("http://localhost:1608/")
                .then(response => response.json())
                .then(data => {
                    const player = document.getElementById("player");

                    if (!data || !data.title || data.status.toLowerCase() !== "playing") {
                        player.classList.add("closed");
                    } else {
                        player.classList.remove("closed");

                        document.getElementById("title").innerText = data.title;
                        document.getElementById("artist").innerText = data.artists ? data.artists.join(", ") : "Unknown Artist";

                        // Check if the song has changed.
                        if (currentTitle !== data.title) {
                            currentTitle = data.title;

                            // Use the exact URL that Tuna provides, plus a cache-buster to force OBS to update it.
                            if (data.cover_url) {
                                document.getElementById("cover").src = data.cover_url + "?_=" + Date.now();
                            } else {
                                document.getElementById("cover").src = ""; // Leave this blank if there is no album art.
                            }
                        }
                    }
                })
                .catch(error => {
                    document.getElementById("player").classList.add("closed");
                });
        }

        setInterval(updateTuna, 1000);
    </script>
</body>

</html>
